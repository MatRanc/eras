<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eras for Last.fm</title>
  <meta name="description" content="Find the albums and artists that ran each stretch of your Last.fm listening history.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Archivo:wdth,wght@62..125,400..800&family=Yanone+Kaffeesatz:wght@600&family=Sofia+Sans+Extra+Condensed:wght@700&family=Roboto+Flex:wdth,wght@62..125,400..800&family=Noto+Sans+Arabic:wdth,wght@62.5,600&family=Noto+Sans+Hebrew:wdth,wght@62.5,600&family=Noto+Sans+Thai:wdth,wght@62.5,600&family=Noto+Sans+Devanagari:wdth,wght@62.5,600&family=Noto+Sans+Bengali:wdth,wght@62.5,600&family=Noto+Sans+Tamil:wdth,wght@62.5,600&family=Noto+Sans+Telugu:wdth,wght@62.5,600&family=Noto+Sans+Kannada:wdth,wght@62.5,600&family=Noto+Sans+Malayalam:wdth,wght@62.5,600&family=Noto+Sans+Gujarati:wdth,wght@62.5,600&family=Noto+Sans+Gurmukhi:wdth,wght@62.5,600&family=Noto+Sans+Sinhala:wdth,wght@62.5,600&family=Noto+Sans+Oriya:wdth,wght@62.5,600&family=Noto+Sans+Georgian:wdth,wght@62.5,600&family=Noto+Sans+Armenian:wdth,wght@62.5,600&family=Noto+Sans+Ethiopic:wdth,wght@62.5,600&family=Noto+Sans+Khmer:wdth,wght@62.5,600&family=Noto+Sans+Lao:wdth,wght@62.5,600&family=Noto+Sans+Myanmar:wdth,wght@62.5,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=26">
  <script>
    // Google Analytics, only on the live site so local testing isn't counted
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    if (location.hostname === 'eras.matranc.com') {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Z9GSXJYCH4';
      document.head.append(s);
      gtag('js', new Date());
      gtag('config', 'G-Z9GSXJYCH4');
    }
  </script>
</head>
<body>
  <header class="jacket" id="jacket">
    <div class="cover" id="cover-frame" aria-hidden="true"></div>
    <div class="jacket-text">
      <h1 id="title">Eras</h1>
      <p class="sub" id="sub">Remember when you only listened to one album for three months?</p>
      <dl class="facts" id="facts" hidden>
        <div><dt>Ran</dt><dd id="f-ran"></dd></div>
        <div><dt>Plays</dt><dd id="f-plays"></dd></div>
        <div><dt>Peak</dt><dd id="f-peak"></dd></div>
        <div><dt id="f-share-name">Share of those months</dt><dd id="f-share"></dd></div>
      </dl>
    </div>
  </header>

  <form class="controls" id="form">
    <label class="user">
      <span>Last.fm username</span>
      <input id="user" name="user" autocomplete="username" autocapitalize="off" spellcheck="false" required placeholder="e.g. c7po">
    </label>
    <button type="submit" id="go">Find eras</button>

    <fieldset class="seg">
      <legend>Eras of</legend>
      <div>
        <label><input type="radio" name="mode" value="album" checked><span>Albums</span></label>
        <label><input type="radio" name="mode" value="artist"><span>Artists</span></label>
        <label><input type="radio" name="mode" value="genre"><span>Genres</span></label>
      </div>
    </fieldset>

    <div class="adjust" id="adjust">
      <button type="button" class="toggle" aria-expanded="false" aria-controls="adjust-panel">Adjust</button>
      <div class="panel" id="adjust-panel">
        <label class="pick">
          <span>Group by</span>
          <select id="bucket" name="b">
            <option value="1">Month</option>
            <option value="2">2 months</option>
            <option value="3">Quarter</option>
            <option value="6">Half year</option>
          </select>
        </label>
        <label class="pick range">
          <span><span id="sens-name">Sensitivity</span> <output id="sens-out" for="sens"></output></span>
          <input type="range" id="sens" name="s" min="1" max="9" value="5">
          <span class="ends" aria-hidden="true"><i id="sens-lo">More eras</i><i id="sens-hi">Fewer eras</i></span>
        </label>
      </div>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <progress id="progress" hidden></progress>

  <main>
    <section class="timeline-wrap" aria-label="Timeline of eras">
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="side" id="side" hidden>
      <h2>The eras so far</h2>
      <ol id="list"></ol>
    </section>
  </main>

  <footer><span>Powered by <a href="https://www.last.fm/api">Last.fm</a> · <a href="https://github.com/MatRanc/eras">Code on GitHub</a></span><span>Made with ❤️ in 🇨🇦</span></footer>

  <script src="config.js"></script>
  <script src="eras.js?v=9"></script>
  <script src="app.js?v=38"></script>
</body>
</html>
