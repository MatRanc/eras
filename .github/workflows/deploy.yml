name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the key lives in a repo secret; it never touches a branch
      - run: echo "window.LASTFM_KEY = \"${{ secrets.LASTFM_API_KEY }}\";" > src/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deploy
        uses: actions/deploy-pages@v4
